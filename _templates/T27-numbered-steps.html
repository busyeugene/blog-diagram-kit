<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T27 · numbered-steps</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T27 — a named 4-step method the reader can remember. Give the steps ONE-WORD names that
     share a pattern (Plan / Plant / Pick / Press). This is the "own a framework" template. */
  .ns{display:flex;gap:30px;width:100%}
  .ns .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  .disc{position:relative;width:190px;height:190px;border-radius:50%;display:flex;
        align-items:center;justify-content:center;color:#fff}
  .disc svg{width:82px;height:82px;stroke:currentColor;fill:none;stroke-width:1.6;
            stroke-linecap:round;stroke-linejoin:round}
  .disc .bdg{position:absolute;left:-6px;top:-6px;width:48px;height:48px;border-radius:50%;
             background:var(--surface);box-shadow:var(--lift);color:var(--ink);
             font-family:var(--font-head);font-weight:800;font-size:21px;
             display:flex;align-items:center;justify-content:center}
  .ns .sn{font-family:var(--font-head);font-weight:800;font-size:26px;letter-spacing:-.015em}
  .ns .sd{font-size:16px;color:var(--muted);line-height:1.4;max-width:210px}
</style>
</head>
<body class="r169">
  <div class="stage top">
    <div class="t-title">The four-step method</div>

    <div class="fill">
      <div class="ns">
        <div class="cell"><div class="disc" style="background:var(--a1)"><span class="bdg">1</span>
          <svg viewBox="0 0 24 24"><path d="M4 19V5M4 6h13l-2 3 2 3H4"/></svg></div>
          <div><div class="sn">Plan</div><div class="sd">What you decide before anything moves.</div></div></div>

        <div class="cell"><div class="disc" style="background:var(--a2)"><span class="bdg">2</span>
          <svg viewBox="0 0 24 24"><path d="M12 21V9M12 9C12 5 9 3 5 3c0 4 3 6 7 6zM12 12c0-3 3-5 7-5 0 3-3 5-7 5z"/></svg></div>
          <div><div class="sn">Set up</div><div class="sd">The work that only has to be done once.</div></div></div>

        <div class="cell"><div class="disc" style="background:var(--a3)"><span class="bdg">3</span>
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
          <div><div class="sn">Run</div><div class="sd">What happens every day once it is live.</div></div></div>

        <div class="cell"><div class="disc" style="background:var(--a4)"><span class="bdg">4</span>
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
          <div><div class="sn">Tune</div><div class="sd">How you find the next thing to fix.</div></div></div>
      </div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
