<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T24 · venn-overlap</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T24 — two ideas people confuse, and the part they genuinely share. The overlap label is the
     payoff. Only use it when the reader really does mix the two up. */
  .vn{position:relative;width:760px;height:520px}
  .circ{position:absolute;top:0;width:400px;height:400px;border-radius:50%;mix-blend-mode:multiply;
        display:flex;align-items:center;font-family:var(--font-head);font-weight:800;font-size:22px;
        text-align:center;line-height:1.25}
  .cA{left:0;   background:#cfe0fb;justify-content:flex-start;padding-left:44px}
  .cB{left:360px;background:#f9d9e8;justify-content:flex-end;padding-right:44px}
  .cA span{width:180px;color:#1e3a8a} .cB span{width:180px;color:#9d174d}
  .ovl{position:absolute;left:380px;top:200px;width:0;height:0;display:flex;align-items:center;
       justify-content:center}
  .ovl span{width:180px;text-align:center;font-family:var(--font-head);font-weight:800;font-size:18px;
            color:var(--ink);line-height:1.25}
  .vcap{position:absolute;left:0;right:0;top:444px;text-align:center;font-size:17px;color:var(--muted)}
</style>
</head>
<body class="r11">
  <div class="stage">
    <div class="vn">
      <div class="circ cA"><span>The wider<br>thing</span></div>
      <div class="circ cB"><span>The narrower<br>thing</span></div>
      <div class="ovl"><span>what<br>they share</span></div>
      <div class="vcap">One line naming the difference people actually get wrong.</div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
