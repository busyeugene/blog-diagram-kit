<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T09 · two-panel</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T09 — define a relationship between two things by showing both and naming the link.
     The label ON the arrow is the whole point; the panels are just the two ends. */
  .tp{display:flex;align-items:center;gap:0;width:100%}
  .side{display:flex;flex-direction:column;align-items:center;gap:22px;flex:1}
  .side .win{width:100%}
  .link{width:210px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
  /* the connector's name sits in a solid pill, clear of the arrow — never bare text on a line */
  .link .lk{font-family:var(--font-head);font-weight:700;font-size:19px;background:var(--surface);
            border-radius:999px;padding:9px 18px;box-shadow:var(--lift);margin-bottom:6px}
  .link .arw{width:150px;background:var(--a4)} .link .arw::after{border-left-color:var(--a4)}
  .who2{font-family:var(--font-head);font-weight:800;font-size:26px;letter-spacing:-.01em}
  .who2 + .cap{font-size:16px;margin-top:4px}
  .hot{background:var(--brand)!important}
</style>
</head>
<body class="r169">
  <div class="stage">
    <div class="tp">
      <div class="side">
        <div class="win" style="width:400px">
          <div class="win-bar"><i></i><i></i><i></i></div>
          <div class="win-body">
            <span class="ln dark"></span><span class="ln hot"></span>
            <span class="ln dark" style="width:80%"></span><span class="ln dark" style="width:65%"></span>
          </div>
        </div>
        <div><div class="who2">Thing A</div><div class="cap">what it does in the relationship</div></div>
      </div>

      <div class="link">
        <span class="lk">the link</span>
        <span class="arw"></span>
      </div>

      <div class="side">
        <div class="win" style="width:400px">
          <div class="win-bar"><i></i><i></i><i></i></div>
          <div class="win-body">
            <span class="ln dark"></span><span class="ln dark" style="width:72%"></span>
            <span class="ln dark"></span><span class="ln dark" style="width:58%"></span>
          </div>
        </div>
        <div><div class="who2">Thing B</div><div class="cap">what it gets out of it</div></div>
      </div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
