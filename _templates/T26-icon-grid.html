<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T26 · icon-grid</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T26 — a set with no order: channels, categories, integrations, failure types. If the items
     have a sequence, use T01/T04 instead. 6 or 9 tiles, never 7 or 8 (ragged last row). */
  .ig{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%}
  .it{background:var(--surface);border-radius:18px;box-shadow:var(--lift);padding:26px 20px;
      display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .it .node{width:76px;height:76px}
  .it .in{font-family:var(--font-head);font-weight:700;font-size:18px;line-height:1.2}
  .it .id{font-size:14px;color:var(--muted);line-height:1.35}
</style>
</head>
<body class="r11">
  <div class="stage top">
    <div class="t-title">Every way it arrives</div>

    <div class="fill">
      <div class="ig">
        <div class="it"><div class="node a1"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z"/><path d="M4 5l8 6 8-6"/></svg></div>
          <div><div class="in">First</div><div class="id">short note</div></div></div>
        <div class="it"><div class="node a2"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h6M9 17h6"/></svg></div>
          <div><div class="in">Second</div><div class="id">short note</div></div></div>
        <div class="it"><div class="node a3"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4z"/></svg></div>
          <div><div class="in">Third</div><div class="id">short note</div></div></div>
        <div class="it"><div class="node a4"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h6"/></svg></div>
          <div><div class="in">Fourth</div><div class="id">short note</div></div></div>
        <div class="it"><div class="node a5"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div>
          <div><div class="in">Fifth</div><div class="id">short note</div></div></div>
        <div class="it"><div class="node tint" style="color:var(--brand)"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></div>
          <div><div class="in">Sixth</div><div class="id">short note</div></div></div>
      </div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
