<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T15 · sentence-dissect</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T15 — take ONE real sentence (a goal, a definition, a rule) and colour-code what each part
     is doing. The sentence must be a sentence a reader could actually write themselves. */
  .ds{display:flex;flex-direction:column;align-items:center;gap:0}
  .sent{display:flex;align-items:flex-end;gap:10px}
  .part{display:flex;flex-direction:column;align-items:center;gap:10px}
  .part .u{height:4px;width:100%;border-radius:2px;background:var(--brand)}
  .part .pl{font-size:17px;color:var(--muted);font-weight:600}
  .brace{margin-top:26px;width:78%;height:34px;border:3px solid var(--a4);border-top:none;
         border-radius:0 0 18px 18px}
  .whole{margin-top:14px;font-family:var(--font-head);font-weight:700;font-size:19px;color:var(--muted)}
</style>
</head>
<body class="r169">
  <div class="stage">
    <div class="ds">
      <div class="sent">
        <div class="part"><span class="hl c1">Verb</span><span class="u"></span><span class="pl">what you do</span></div>
        <div class="part"><span class="hl c2">the thing you move</span><span class="u"></span><span class="pl">the metric</span></div>
        <div class="part"><span class="hl c3">by 10%</span><span class="u"></span><span class="pl">how much</span></div>
        <div class="part"><span class="hl c4">in 6 months</span><span class="u"></span><span class="pl">by when</span></div>
      </div>
      <div class="brace"></div>
      <div class="whole">…and together, that is the rule</div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
