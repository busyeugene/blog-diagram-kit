<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T16 · exploded-stack</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T16 — one system pulled apart into the layers it is really made of. Skewed plates read as
     "one stack"; flat rows do not. Bottom plate = the foundation everything else assumes. */
  .ex{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;width:100%;
      padding-left:26px}
  .pl2{display:flex;align-items:center;gap:30px}
  .plate{width:276px;height:82px;border-radius:12px;flex:none;transform:skewX(-24deg);
         box-shadow:var(--lift)}
  .pl2 .txt{flex:1}
  .pl2 .pn{font-family:var(--font-head);font-weight:800;font-size:22px;letter-spacing:-.01em}
  .pl2 .pd{font-size:16px;color:var(--muted);line-height:1.35;margin-top:5px}
</style>
</head>
<body class="r11">
  <div class="stage top">
    <div class="t-title">What it is made of</div>

    <div class="ex">
      <div class="pl2"><span class="plate" style="background:var(--a1)"></span>
        <div class="txt"><div class="pn">Top layer</div><div class="pd">What people actually touch.</div></div></div>
      <div class="pl2"><span class="plate" style="background:var(--a2)"></span>
        <div class="txt"><div class="pn">Middle layer</div><div class="pd">The logic that decides things.</div></div></div>
      <div class="pl2"><span class="plate" style="background:#4c8fdb"></span>
        <div class="txt"><div class="pn">Data layer</div><div class="pd">Where the record of truth lives.</div></div></div>
      <div class="pl2"><span class="plate" style="background:var(--muted)"></span>
        <div class="txt"><div class="pn">Foundation</div><div class="pd">Everything above breaks if this is wrong.</div></div></div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
