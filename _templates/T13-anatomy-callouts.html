<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>T13 · anatomy-callouts</title>
<link rel="stylesheet" href="../_system/brand-neutral.css">
<link rel="stylesheet" href="../_system/base.css">
<style>
  /* T13 — "what this one thing is made of". One big object, 5 numbered parts, thin leader lines.
     Works for anything with named components. Keep every callout to 1-3 words. */
  .an{position:relative;width:760px;height:760px}
  .ring2{position:absolute;left:200px;top:200px;width:360px;height:360px;border-radius:50%;
         background:conic-gradient(var(--a2) 0 72deg, var(--a4) 72deg 144deg, var(--a3) 144deg 216deg,
                                   var(--a5) 216deg 288deg, var(--a1) 288deg 360deg)}
  .ring2::after{content:"";position:absolute;inset:74px;border-radius:50%;background:var(--canvas)}
  .core{position:absolute;left:200px;top:200px;width:360px;height:360px;display:flex;
        align-items:center;justify-content:center;font-family:var(--font-head);font-weight:800;
        font-size:23px;text-align:center;line-height:1.25;color:var(--ink)}
  .co{position:absolute;display:flex;align-items:center;gap:11px;width:220px}
  .co .ct{font-family:var(--font-head);font-weight:700;font-size:20px;line-height:1.2}
  /* row-reverse INVERTS justify-content: flex-start packs to the RIGHT, which is what puts the
     badge next to the diagram on left-hand callouts. flex-end would left-pack the whole group. */
  .co.rt{flex-direction:row-reverse;justify-content:flex-start;text-align:right}
</style>
</head>
<body class="r11">
  <div class="stage">
    <div class="an">
      <svg class="svg-layer" viewBox="0 0 760 760" fill="none" stroke="#a8afbe" stroke-width="1.8">
        <path d="M448 239 L520 150"/><path d="M503 406 L612 447"/><path d="M380 510 L380 620"/>
        <path d="M257 406 L148 447"/><path d="M292 239 L220 150"/>
      </svg>

      <div class="ring2"></div>
      <div class="core">The thing<br>you are<br>breaking down</div>

      <div class="co"    style="left:524px;top:120px"><span class="num" style="background:var(--a2)">1</span><span class="ct">First part</span></div>
      <div class="co"    style="left:618px;top:428px"><span class="num" style="background:var(--a4)">2</span><span class="ct">Second part</span></div>
      <div class="co"    style="left:270px;top:626px;width:220px;justify-content:center"><span class="num" style="background:var(--a3)">3</span><span class="ct">Third part</span></div>
      <div class="co rt" style="left:-78px;top:428px"><span class="num" style="background:var(--a5)">4</span><span class="ct">Fourth part</span></div>
      <div class="co rt" style="left:0px;top:120px"><span class="num" style="background:var(--a1)">5</span><span class="ct">Fifth part</span></div>
    </div>

    <div class="site">clientdomain.com</div>
  </div>
</body></html>
